 <!DOCTYPE html> <!--VERSÃO DO HTML (MAIS MODERNA)-->

 <html lang="pt-br"> <!-- FICA TODO O SITE -->

    <head>  <!-- CABEÇA - CONFIGURAÇÕES -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css"> <!-- Link para o arquivo style.css -->
        
        
        <title>GASTO DA FOTO</title>
    </head>

     <body> <!-- TODA A PARTE VISÍVEL -->
  
        <div class="header">
            <h1>📸 Gasto na Foto</h1>
            <p class="topo">Fotografe o comprovante. A IA anota pra você.</p>   
        </div>


        <div class="caixa-total">
            <p>Total gasto</p> 
            <h2 class="total-gasto">R$ 0,00</h2>
            <p class="comprovantes-lidos">0 comprovantes lidos</p>  
        </div>


        <!-- CÂMERA E CAPTURA DE FOTO -->
        
        <div class="camera-container">
            <button id="abrirCamera" class="btn-camera">📸 Toque para fotografar</button>
            
            <!-- Elemento de vídeo (fica oculto até o usuário clicar) -->
            <video id="video" class="video-camera" playsinline></video>
            
            <!-- Canvas para capturar a foto (oculto) -->
            <canvas id="canvas" style="display: none;"></canvas>
            
            <!-- Botão para tirar foto (só aparece quando câmera está ativa) -->
            <button id="tirarFoto" class="btn-tirar-foto" style="display: none;">📷 Tirar Foto</button>
            
            <!-- Botão para fechar câmera -->
            <button id="fecharCamera" class="btn-fechar-camera" style="display: none;">❌ Fechar Câmera</button>
        </div>

        <div class="lista">

        </div>
</body>
<script src="https://js.puter.com/v2/"></script>
<script src="scripts.js">
    
</script>

</html>
